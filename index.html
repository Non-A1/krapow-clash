<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRAPOW-CLASH | AI HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="street-food-noir">
    <!-- UI Layout -->
    <div class="tactical-hud">
        <header class="hud-header">
            <div class="system-stats">
                <span class="stat-item pulse">● SYS_ACTIVE</span>
                <span class="stat-item" id="ai-status">AI_STATE: STANDBY</span>
            </div>
            <h1>KRAPOW_CLASH <span class="thai-glitch">กะเพรา</span></h1>
        </header>

        <main class="hud-main">
            <section class="vision-module">
                <div class="camera-lens">
                    <div id="debug-log">SYSTEM_READY // CLICK_TO_BOOT</div>
                    <div id="chef-stage" class="hidden">
                        <div class="kitchen-environment">
                            <img src="images/thai-chef.png" alt="Chef" class="chef-ai" id="chef-img">
                            <div id="final-plate" class="hidden">
                                <img src="images/krapow-plate.png" alt="Serve" class="plate-render" id="dynamic-dish">
                                <div class="serve-alert">MISSION_COMPLETE: ENJOY</div>
                            </div>
                        </div>
                    </div>
                    <div class="hud-overlay-grid"></div>
                </div>
            </section>

            <section class="control-module">
                <!-- Selections... (Keep your previous protein/side/veggie glass-cards here) -->
                <button class="ignite-btn" id="launch-btn">SYSTEM_BOOT</button>
            </section>
        </main>
    </div>

    <video id="video" playsinline style="display:none"></video>

    <!-- AI LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.3.0/dist/fingerpose.min.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const video = document.getElementById("video");
        const debugLog = document.getElementById("debug-log");
        const aiStatus = document.getElementById('ai-status');
        const chefStage = document.getElementById("chef-stage");
        const plate = document.getElementById('final-plate');
        const chefImg = document.getElementById('chef-img');
        const dynamicDish = document.getElementById('dynamic-dish');

        let isBooted = false;

        // *** STEP 1: THE VERIFICATION LOOP (The fix goes here) ***
        async function getFingerpose() {
            return new Promise((resolve) => {
                const timer = setInterval(() => {
                    const fp = window.fp || window.fingerpose;
                    if (fp && fp.GestureEstimator) {
                        clearInterval(timer);
                        resolve(fp);
                    }
                }, 100);
            });
        }

        // *** STEP 2: UPDATED BOOT SEQUENCE ***
        async function bootSystem() {
            try {
                debugLog.innerText = "ACCESSING_LENS...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                await video.play();
                
                debugLog.innerText = "WAITING_FOR_AI_HANDSHAKE...";
                // This line now waits for Step 1 to confirm library status
                const fp = await getFingerpose();
                
                debugLog.innerText = "LOADING_HANDPOSE_MODEL...";
                const model = await handpose.load();
                const GE = new fp.GestureEstimator([fp.Gestures.ThumbsUpGesture]);
                
                aiStatus.innerText = "AI_STATE: ONLINE";
                debugLog.innerText = "GSR_READY: AWAITING_GESTURE";
                launchBtn.innerText = "INITIALIZE_IGNITION";
                isBooted = true;

                async function loop() {
                    const hands = await model.estimateHands(video);
                    if (hands.length > 0) {
                        const est = await GE.estimate(hands[0].landmarks, 8.0);
                        if (est.gestures.length > 0) {
                            const top = est.gestures.sort((a,b) => b.confidence - a.confidence)[0];
                            if (top.name === 'thumbs_up' && !launchBtn.disabled && isBooted) {
                                triggerCook();
                            }
                        }
                    }
                    requestAnimationFrame(loop);
                }
                loop();
            } catch (err) { 
                debugLog.innerText = "BOOT_ERR: " + err.message;
            }
        }

        // Selection & Trigger logic remains the same...
        launchBtn.addEventListener('click', () => {
            if (!isBooted) bootSystem();
            else triggerCook();
        });

        async function triggerCook() {
            // ... (Keep your triggerCook code here)
        }
    </script>
</body>
</html>
