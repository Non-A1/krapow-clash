<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krapow-Clash | Bamboo Hut AI HUD</title>
    <!-- AI LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.3.0/dist/fingerpose.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bamboo-theme">
    <div class="hud-container">
        <header>
            <div class="status-bar">
                <span class="pulse">● SAWASDEE</span>
                <span id="temp-display">WOK: 185°C</span>
                <span id="audio-status">LO-FI: ACTIVE</span>
            </div>
            <h1>KRAPOW-CLASH <span class="gold-text">กะเพรา</span></h1>
        </header>

        <main class="main-layout">
            <section class="vision-panel">
                <div class="camera-feed thai-border">
                    <div id="chef-stage" class="hidden">
                        <div class="chef-container">
                            <img src="images/thai-chef.png" alt="Chef" class="chef-sprite" id="chef-img">
                            <div id="ingredient-drop" class="hidden"></div>
                            <div id="final-plate" class="hidden">
                                <img src="images/krapow-plate.png" alt="Finished Dish" class="plate-img">
                                <p class="serve-text">อร่อย! (ENJOY!)</p>
                            </div>
                            <div class="cooking-fx">
                                <div class="steam-particle"></div>
                                <div class="fire-base"></div>
                            </div>
                        </div>
                    </div>
                    <div class="scanner-overlay"></div>
                    <p class="feed-label">AI VISION ACTIVE</p>
                </div>
            </section>

            <section class="control-panel">
                <div class="menu-card protein-card">
                    <h3><span class="thai-num">๑</span> PROTEIN</h3>
                    <div class="btn-grid" data-group="protein">
                        <button class="active"><img src="images/pork.png" alt="" class="food-icon">PORK</button>
                        <button><img src="images/chicken.png" alt="" class="food-icon">CHICKEN</button>
                        <button><img src="images/beef.png" alt="" class="food-icon">BEEF</button>
                    </div>
                </div>

                <div class="menu-card side-card">
                    <h3><span class="thai-num">๒</span> SIDES</h3>
                    <div class="btn-grid" data-group="side">
                        <button class="active"><img src="images/white-rice.png" alt="" class="food-icon">WHITE RICE</button>
                        <button><img src="images/brown-rice.png" alt="" class="food-icon">BROWN RICE</button>
                        <button><img src="images/puree.png" alt="" class="food-icon">PUREE</button>
                        <button>NONE</button>
                    </div>
                </div>

                <div class="menu-card veggie-card">
                    <h3><span class="thai-num">๓</span> VEGGIES</h3>
                    <div class="btn-grid" data-group="veggie">
                        <button class="active"><img src="images/tofu.png" alt="" class="food-icon">TOFU</button>
                        <button><img src="images/lettuce.png" alt="" class="food-icon">LETTUCE</button>
                        <button><img src="images/spinach.png" alt="" class="food-icon">SPINACH</button>
                        <button><img src="images/kale.png" alt="" class="food-icon">KALE</button>
                    </div>
                </div>

                <div class="menu-card spice-card">
                    <h3><span class="thai-num">๔</span> CHILI LEVEL</h3>
                    <div class="slider-container">
                        <div id="slider-flame" class="chili-flame"></div>
                        <input type="range" min="1" max="10" value="5" class="slider" id="chili-slider">
                    </div>
                </div>

                <button class="launch-btn thai-btn" id="launch-btn">INITIALIZE COOK</button>
            </section>
        </main>
    </div>

    <video id="video" playsinline style="display: none;"></video>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const video = document.getElementById("video");
        const chefStage = document.getElementById("chef-stage");
        const scannerOverlay = document.querySelector(".scanner-overlay");
        const chiliSlider = document.getElementById("chili-slider");
        const sliderFlame = document.getElementById("slider-flame");
        const dropZone = document.getElementById('ingredient-drop');
        const plate = document.getElementById('final-plate');
        const chefImg = document.getElementById('chef-img');

        // FIXED FLAME POSITIONING LOGIC
        function updateFlame() {
            const val = chiliSlider.value;
            const min = chiliSlider.min;
            const max = chiliSlider.max;
            
            // Calculate percentage across the slider
            const percent = (val - min) / (max - min);
            
            // Apply horizontal offset based on slider width
            const offset = percent * 100;
            sliderFlame.style.left = `calc(${offset}% - 10px)`; // -10px centers the flame
            
            // Scale and intensity
            const scale = 0.6 + (val * 0.25);
            sliderFlame.style.transform = `scale(${scale})`;
            sliderFlame.style.boxShadow = `0 0 ${val * 6}px #ff4500`;
            
            // Change color for Nuclear levels
            sliderFlame.style.background = val > 8 
                ? "linear-gradient(to top, #ff0000, #ffcc00, #ffffff)" 
                : "linear-gradient(to top, #ff4500, #ff8c00, transparent)";
        }

        chiliSlider.addEventListener('input', updateFlame);
        window.addEventListener('resize', updateFlame); // Keep aligned on resize
        updateFlame(); // Initial call

        document.querySelectorAll('.btn-grid button').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            return new Promise((resolve) => video.onloadedmetadata = () => resolve(video));
        }

        async function runAI() {
            const model = await handpose.load();
            const GE = new fp.GestureEstimator([fp.Gestures.ThumbsUpGesture]);
            async function detect() {
                const predictions = await model.estimateHands(video);
                if (predictions.length > 0) {
                    const gesture = await GE.estimate(predictions[0].landmarks, 8.5);
                    if (gesture.gestures.length > 0) {
                        const best = gesture.gestures.sort((a,b) => b.confidence - a.confidence)[0];
                        if (best.name === 'thumbs_up' && !launchBtn.disabled) { launchBtn.click(); }
                    }
                }
                requestAnimationFrame(detect);
            }
            detect();
        }

        launchBtn.addEventListener('click', async () => {
            launchBtn.disabled = true;
            const ingredients = [
                document.querySelector('[data-group="protein"] .active img')?.src,
                document.querySelector('[data-group="side"] .active img')?.src,
                document.querySelector('[data-group="veggie"] .active img')?.src
            ].filter(Boolean);

            scannerOverlay.classList.add('hidden');
            chefStage.classList.remove('hidden');

            for (const src of ingredients) {
                await new Promise(res => {
                    dropZone.style.backgroundImage = `url('${src}')`;
                    dropZone.className = 'ingredient-anim';
                    dropZone.classList.remove('hidden');
                    setTimeout(() => { dropZone.classList.add('hidden'); res(); }, 800);
                });
            }

            launchBtn.innerText = "SIZZLING...";
            chefImg.style.animationDuration = '0.15s';

            setTimeout(() => {
                chefImg.style.animation = 'none';
                plate.classList.remove('hidden');
                launchBtn.innerText = "SERVED!";
                setTimeout(() => {
                    chefStage.classList.add('hidden');
                    plate.classList.add('hidden');
                    scannerOverlay.classList.remove('hidden');
                    launchBtn.innerText = "INITIALIZE COOK";
                    launchBtn.disabled = false;
                    chefImg.style.animation = '';
                }, 4000);
            }, 2000);
        });

        setupCamera().then(runAI);
    </script>
</body>
</html>
