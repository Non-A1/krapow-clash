<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krapow-Clash | Bamboo Hut AI HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bamboo-theme">
    <div class="hud-container">
        <header>
            <div class="status-bar">
                <span class="pulse">● SAWASDEE</span>
                <span id="ai-status">AI: INITIALIZING...</span>
            </div>
            <h1>KRAPOW-CLASH <span class="gold-text">กะเพรา</span></h1>
        </header>

        <main class="main-layout">
            <section class="vision-panel">
                <div class="camera-feed thai-border">
                    <div id="debug-log">System Booting...</div>
                    <div id="chef-stage" class="hidden">
                        <div class="chef-container">
                            <img src="images/thai-chef.png" alt="Chef" class="chef-sprite" id="chef-img">
                            <div id="ingredient-drop" class="hidden"></div>
                            <div id="final-plate" class="hidden">
                                <img src="images/krapow-plate.png" alt="Finished Dish" class="plate-img" id="dynamic-dish">
                                <p class="serve-text">อร่อย! (ENJOY!)</p>
                            </div>
                            <div class="cooking-fx"><div class="steam-particle"></div></div>
                        </div>
                    </div>
                    <div class="scanner-overlay"></div>
                </div>
            </section>

            <section class="control-panel">
                <!-- Proteins -->
                <div class="menu-card" data-category="protein">
                    <h3>๑. PROTEIN</h3>
                    <div class="btn-grid">
                        <button class="active" id="pork">PORK</button>
                        <button id="chicken">CHICKEN</button>
                        <button id="beef">BEEF</button>
                    </div>
                </div>
                <!-- Sides -->
                <div class="menu-card" data-category="side">
                    <h3>๒. SIDES</h3>
                    <div class="btn-grid">
                        <button class="active" id="white-rice">WHITE RICE</button>
                        <button id="brown-rice">BROWN RICE</button>
                        <button id="puree">PUREE</button>
                    </div>
                </div>
                <!-- Veggies -->
                <div class="menu-card" data-category="veggie">
                    <h3>๓. VEGGIES</h3>
                    <div class="btn-grid">
                        <button class="active" id="tofu">TOFU</button>
                        <button id="spinach">SPINACH</button>
                        <button id="kale">KALE</button>
                    </div>
                </div>

                <div class="menu-card">
                    <h3>๔. CHILI LEVEL</h3>
                    <div class="slider-container">
                        <div id="slider-flame" class="chili-flame"></div>
                        <input type="range" min="1" max="10" value="5" class="slider" id="chili-slider">
                    </div>
                </div>
                <button class="launch-btn" id="launch-btn">INITIALIZE COOK</button>
            </section>
        </main>
    </div>

    <video id="video" playsinline style="display:none"></video>

    <!-- LIBS LOADED WITH FAILSAFE ATTRIBUTES -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.3.0/dist/fingerpose.min.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const video = document.getElementById("video");
        const debugLog = document.getElementById("debug-log");
        const aiStatus = document.getElementById('ai-status');
        const chefStage = document.getElementById("chef-stage");
        const dropZone = document.getElementById('ingredient-drop');
        const plate = document.getElementById('final-plate');
        const chefImg = document.getElementById('chef-img');
        const dynamicDish = document.getElementById('dynamic-dish');

        // Button Group Logic
        document.querySelectorAll('.btn-grid button').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // SIGNAL SCHOOL STYLE FAILSAFE: Verification of dependencies
        async function verifyLibs() {
            return new Promise((resolve) => {
                const check = () => {
                    const fp = window.fp || window.fingerpose;
                    if (window.tf && window.handpose && fp) {
                        resolve(fp);
                    } else {
                        debugLog.innerText = "Connecting AI Signal...";
                        setTimeout(check, 500);
                    }
                };
                check();
            });
        }

        async function initApp() {
            try {
                // 1. Wait for Library "Handshake"
                const fingerposeObj = await verifyLibs();
                
                // 2. Start Camera
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();

                // 3. Load Handpose Model
                aiStatus.innerText = "AI: LOADING MODELS...";
                const model = await handpose.load();
                
                const GE = new fingerposeObj.GestureEstimator([
                    fingerposeObj.Gestures.ThumbsUpGesture
                ]);
                
                aiStatus.innerText = "AI: ACTIVE";
                debugLog.innerText = "Ready for Thumbs Up!";

                async function detect() {
                    const predictions = await model.estimateHands(video);
                    if (predictions.length > 0) {
                        const gesture = await GE.estimate(predictions[0].landmarks, 8.0);
                        if (gesture.gestures.length > 0) {
                            const result = gesture.gestures.sort((a,b) => b.confidence - a.confidence)[0];
                            if (result.name === 'thumbs_up' && !launchBtn.disabled) {
                                launchBtn.click();
                            }
                        }
                    }
                    requestAnimationFrame(detect);
                }
                detect();
            } catch (err) { 
                debugLog.innerText = "Comm Error: " + err.message;
                aiStatus.innerText = "AI: OFFLINE";
            }
        }

        // Narrative Sequence: Dynamic Dish Presentation
        launchBtn.addEventListener('click', async () => {
            launchBtn.disabled = true;
            const p = document.querySelector('[data-category="protein"] .active').id;
            const s = document.querySelector('[data-category="side"] .active').id;
            const v = document.querySelector('[data-category="veggie"] .active').id;
            const finalDishKey = `${p}-${s}-${v}.png`;

            document.querySelector('.scanner-overlay').classList.add('hidden');
            chefStage.classList.remove('hidden');

            launchBtn.innerText = "COOKING...";
            chefImg.style.animationDuration = '0.15s';

            setTimeout(() => {
                dynamicDish.src = `images/finished/${finalDishKey}`;
                dynamicDish.onerror = () => { dynamicDish.src = 'images/krapow-plate.png'; }; 

                chefImg.style.animation = 'none';
                plate.classList.remove('hidden');
                launchBtn.innerText = "SERVED!";

                setTimeout(() => {
                    chefStage.classList.add('hidden');
                    plate.classList.add('hidden');
                    document.querySelector('.scanner-overlay').classList.remove('hidden');
                    launchBtn.innerText = "INITIALIZE COOK";
                    launchBtn.disabled = false;
                    chefImg.style.animation = '';
                }, 4000);
            }, 3000);
        });

        // Flame Positioning
        const chiliSlider = document.getElementById("chili-slider");
        const sliderFlame = document.getElementById("slider-flame");
        chiliSlider.addEventListener('input', () => {
            const val = chiliSlider.value;
            const percent = (val - 1) / 9;
            sliderFlame.style.left = `calc(${percent * 100}% - 10px)`;
            sliderFlame.style.transform = `scale(${0.6 + (val * 0.25)})`;
        });

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
