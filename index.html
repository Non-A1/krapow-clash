<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krapow-Clash | Bamboo Hut AI HUD</title>
    <!-- LIBS -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.3.0/dist/fingerpose.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bamboo-theme">
    <div class="hud-container">
        <header>
            <div class="status-bar">
                <span class="pulse">● SAWASDEE</span>
                <span id="ai-status">AI: LOADING...</span>
            </div>
            <h1>KRAPOW-CLASH <span class="gold-text">กะเพรา</span></h1>
        </header>

        <main class="main-layout">
            <section class="vision-panel">
                <div class="camera-feed thai-border">
                    <!-- DEBUG HUD: Shows what AI sees -->
                    <div id="debug-log">Ready...</div>
                    
                    <div id="chef-stage" class="hidden">
                        <div class="chef-container">
                            <img src="images/thai-chef.png" alt="Chef" class="chef-sprite" id="chef-img">
                            <div id="ingredient-drop" class="hidden"></div>
                            <div id="final-plate" class="hidden">
                                <img src="images/krapow-plate.png" alt="Finished Dish" class="plate-img">
                                <p class="serve-text">อร่อย! (ENJOY!)</p>
                            </div>
                            <div class="cooking-fx"><div class="steam-particle"></div></div>
                        </div>
                    </div>
                    <div class="scanner-overlay"></div>
                </div>
            </section>

            <section class="control-panel">
                <!-- Proteins Group -->
                <div class="menu-card">
                    <h3>๑. PROTEIN</h3>
                    <div class="btn-grid" data-group="protein">
                        <button class="active"><img src="images/pork.png" alt="" class="food-icon">PORK</button>
                        <button><img src="images/chicken.png" alt="" class="food-icon">CHICKEN</button>
                        <button><img src="images/beef.png" alt="" class="food-icon">BEEF</button>
                    </div>
                </div>
                <!-- Sides Group -->
                <div class="menu-card">
                    <h3>๒. SIDES</h3>
                    <div class="btn-grid" data-group="side">
                        <button class="active"><img src="images/white-rice.png" alt="" class="food-icon">WHITE RICE</button>
                        <button><img src="images/brown-rice.png" alt="" class="food-icon">BROWN RICE</button>
                        <button><img src="images/puree.png" alt="" class="food-icon">PUREE</button>
                    </div>
                </div>
                <!-- Veg Group -->
                <div class="menu-card">
                    <h3>๓. VEGGIES</h3>
                    <div class="btn-grid" data-group="veggie">
                        <button class="active"><img src="images/tofu.png" alt="" class="food-icon">TOFU</button>
                        <button><img src="images/lettuce.png" alt="" class="food-icon">LETTUCE</button>
                    </div>
                </div>
                <!-- Spice Slider -->
                <div class="menu-card">
                    <h3>๔. CHILI LEVEL</h3>
                    <div class="slider-container">
                        <div id="slider-flame" class="chili-flame"></div>
                        <input type="range" min="1" max="10" value="5" class="slider" id="chili-slider">
                    </div>
                </div>
                <button class="launch-btn" id="launch-btn">INITIALIZE COOK</button>
            </section>
        </main>
    </div>

    <video id="video" playsinline style="display:none"></video>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const video = document.getElementById("video");
        const aiStatus = document.getElementById("ai-status");
        const debugLog = document.getElementById("debug-log");
        const chefStage = document.getElementById("chef-stage");
        const plate = document.getElementById('final-plate');
        const dropZone = document.getElementById('ingredient-drop');

        // 1. Camera Setup
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();
                debugLog.innerText = "Camera: Active";
            } catch (err) {
                debugLog.innerText = "Camera Error: " + err.message;
            }
        }

        // 2. AI Implementation
        async function initAI() {
            aiStatus.innerText = "AI: LOADING MODEL...";
            const model = await handpose.load();
            aiStatus.innerText = "AI: READY";
            
            // Critical Fix: Explicitly checking library load
            const fpLib = window.fp || window.fingerpose;
            if (!fpLib) {
                debugLog.innerText = "Error: Fingerpose Lib missing";
                return;
            }

            const GE = new fpLib.GestureEstimator([fpLib.Gestures.ThumbsUpGesture]);

            async function frameLoop() {
                const predictions = await model.estimateHands(video);
                
                if (predictions.length > 0) {
                    debugLog.innerText = "Hand Detected";
                    const gesture = await GE.estimate(predictions[0].landmarks, 7.5);
                    
                    if (gesture.gestures.length > 0) {
                        const result = gesture.gestures.sort((a,b) => b.confidence - a.confidence)[0];
                        debugLog.innerText = `Detected: ${result.name} (${Math.round(result.confidence)}%)`;
                        
                        if (result.name === 'thumbs_up' && !launchBtn.disabled) {
                            launchBtn.click();
                        }
                    }
                } else {
                    debugLog.innerText = "No hand in view";
                }
                requestAnimationFrame(frameLoop);
            }
            frameLoop();
        }

        // 3. Narrative Sequence
        launchBtn.addEventListener('click', async () => {
            launchBtn.disabled = true;
            const ingredients = [
                document.querySelector('[data-group="protein"] .active img')?.src,
                document.querySelector('[data-group="side"] .active img')?.src,
                document.querySelector('[data-group="veggie"] .active img')?.src
            ].filter(Boolean);

            document.querySelector('.scanner-overlay').classList.add('hidden');
            chefStage.classList.remove('hidden');

            for (const src of ingredients) {
                await new Promise(res => {
                    dropZone.style.backgroundImage = `url('${src}')`;
                    dropZone.className = 'ingredient-anim';
                    dropZone.classList.remove('hidden');
                    setTimeout(() => { dropZone.classList.add('hidden'); res(); }, 800);
                });
            }

            launchBtn.innerText = "COOKING...";
            setTimeout(() => {
                plate.classList.remove('hidden');
                launchBtn.innerText = "SERVED!";
                setTimeout(() => {
                    chefStage.classList.add('hidden');
                    plate.classList.add('hidden');
                    document.querySelector('.scanner-overlay').classList.remove('hidden');
                    launchBtn.innerText = "INITIALIZE COOK";
                    launchBtn.disabled = false;
                }, 4000);
            }, 2000);
        });

        // Initialize
        startCamera().then(initAI);

        // Flame Positioning
        const chiliSlider = document.getElementById("chili-slider");
        const sliderFlame = document.getElementById("slider-flame");
        chiliSlider.addEventListener('input', () => {
            const val = chiliSlider.value;
            const percent = (val - 1) / 9;
            sliderFlame.style.left = `calc(${percent * 100}% - 10px)`;
            sliderFlame.style.transform = `scale(${0.6 + (val * 0.25)})`;
        });
    </script>
</body>
</html>
