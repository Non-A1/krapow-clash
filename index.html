<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krapow-Clash | Royal Thai AI HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.3.0/dist/fingerpose.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container thai-theme">
        <header>
            <div class="status-bar">
                <span class="pulse">● SAWASDEE</span>
                <span id="temp-display">WOK: 185°C</span>
                <span id="audio-status">STREET SYNC: ON</span>
            </div>
            <h1>KRAPOW-CLASH <span class="gold-text">กะเพรา</span></h1>
        </header>

        <main class="main-layout">
            <!-- Left Panel: AI Vision -->
            <section class="vision-panel">
                <div class="camera-feed thai-border">
                    <div class="scanner-overlay"></div>
                    <p class="feed-label">AI VISION ACTIVE</p>
                </div>
            </section>

            <!-- Right Panel: Controls -->
            <section class="control-panel">
                <!-- 01. Proteins -->
                <div class="menu-card protein-card">
                    <h3><span class="thai-num">๑</span> PROTEIN</h3>
                    <div class="btn-grid">
                        <button class="active"><img src="images/pork.png" alt="" class="protein-icon">PORK</button>
                        <button><img src="images/chicken.png" alt="" class="protein-icon">CHICKEN</button>
                        <button><img src="images/beef.png" alt="" class="protein-icon">BEEF</button>
                    </div>
                </div>

                <!-- 02. Sides (NEW) -->
                <div class="menu-card side-card">
                    <h3><span class="thai-num">๒</span> SIDES</h3>
                    <div class="btn-grid">
                        <button><img src="images/white-rice.png" alt="" class="protein-icon">WHITE RICE</button>
                        <button><img src="images/brown-rice.png" alt="" class="protein-icon">BROWN RICE</button>
                        <button><img src="images/puree.png" alt="" class="protein-icon">PUREE</button>
                        <button>NONE</button>
                    </div>
                </div>

                <!-- 03. Vegetarian -->
                <div class="menu-card veggie-card">
                    <h3><span class="thai-num">๓</span> VEGGIES</h3>
                    <div class="btn-grid">
                        <button><img src="images/tofu.png" alt="" class="protein-icon">TOFU</button>
                        <button><img src="images/lettuce.png" alt="" class="protein-icon">LETTUCE</button>
                        <button><img src="images/spinach.png" alt="" class="protein-icon">SPINACH</button>
                        <button><img src="images/kale.png" alt="" class="protein-icon">KALE</button>
                    </div>
                </div>

                <div class="menu-card spice-card">
                    <h3><span class="thai-num">๔</span> CHILI LEVEL</h3>
                    <input type="range" min="1" max="10" value="7" class="slider">
                </div>

                <button class="launch-btn thai-btn">INITIALIZE COOK</button>
            </section>
        </main>
    </div>
    <video id="video" playsinline style="display: none;"></video>
    <!-- [Insert previous JavaScript logic here] -->
</body>
</html>
